<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <!-- Book cover background with gradient -->
  <rect width="600" height="800" fill="url(#grad)" />
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book spine effect -->
  <rect x="20" y="20" width="560" height="760" rx="8" fill="white" opacity="0.1" />
  
  <!-- Title text -->
  <text x="300" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="white">AI and the Art of</text>
  <text x="300" y="270" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">Productive</text>
  <text x="300" y="340" font-family="Arial, sans-serif" font-size="60" font-weight="bold" text-anchor="middle" fill="white">Struggle</text>
  
  <!-- Abstract graphic elements -->
  <path d="M100,400 C150,350 200,450 250,400 S350,350 400,400 S500,450 550,400" stroke="white" stroke-width="4" fill="none" opacity="0.7" />
  <path d="M100,450 C150,400 200,500 250,450 S350,400 400,450 S500,500 550,450" stroke="white" stroke-width="4" fill="none" opacity="0.5" />
  <path d="M100,500 C150,450 200,550 250,500 S350,450 400,500 S500,550 550,500" stroke="white" stroke-width="4" fill="none" opacity="0.3" />
  
  <!-- Author name -->
  <text x="300" y="650" font-family="Arial, sans-serif" font-size="36" text-anchor="middle" fill="white">Dr. Ernesto Lee</text>
</svg>
